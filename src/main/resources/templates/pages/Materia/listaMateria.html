<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/MaterialDesign-Webfont/5.3.45/css/materialdesignicons.min.css" />
    <link rel="icon" type="image/png" th:href="@{/imagenes/img001-logo.png}" />

    <link rel="stylesheet" th:href="@{/css/stylesAditional.css}">

    <title>Lista Materias</title>
</head>
<body class="bg-white text-gray-900">
<!-- Sección 1: Barra de navegación -->
<div class="m-4 md:m-14">
    <nav class="bg-gray-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200 ">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a th:href="@{/}" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="/imagenes/img001-logo.png" class="h-8" alt="Flowbite Logo">
                <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">TaskFlow</span>
            </a>
            <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
                <a th:href="@{/admin/home}">
                    <button type="button"
                            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">
                        Regresar
                    </button>
                </a>
            </div>
        </div>
    </nav>
</div>

<div class="p-5">
<div class="w-full max-w-6xl bg-gray-300 p-6 rounded-xl shadow-md mx-auto mt-5">

    <!-- Título principal -->
    <h1 class="mb-6 text-3xl md:text-4xl font-extrabold text-center text-black">
        Lista de Materias
    </h1>

    <!-- Contenedor con altura máxima y scroll vertical -->
    <div class="overflow-y-auto max-h-[400px] rounded-lg">
        <table class="min-w-full divide-y divide-gray-300 shadow rounded-lg">
            <thead class="bg-blue-500 text-white sticky top-0 z-10 text-center">
            <tr>
                <th class="px-4 py-2 ">ID</th>
                <th class="px-4 py-2 ">Nombre</th>
                <th class="px-4 py-2 ">Profesor Asignado</th>
                <th class="px-4 py-2 ">Opciones</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200 text-center">
            <tr th:each="materia : ${materias}" class="hover:bg-gray-50">
                <td class="px-4 py-2" th:text="${materia.id}"></td>
                <td class="px-4 py-2" th:text="${materia.nombre}"></td>
                <td class="px-4 py-2" th:text="${materia.docente.nombre}"></td>
                <td class="px-4 py-2 flex justify-center space-x-2">
                    <a th:href="@{/materia/editarMateria/}+${materia.id}"
                       class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">
                        Actualizar
                    </a>
                    <a th:href="@{/materia/eliminarMateria/}+${materia.id}"
                       class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                        Eliminar
                    </a>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón para añadir nueva materia -->
    <div class="flex justify-end gap-4 mt-6 bg-gray-400 p-4 rounded-lg shadow-inner">
        <a th:href="@{/materia/formularioMateria}"
           class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
            <i class="fas fa-plus-circle mr-1"></i> Nueva Materia
        </a>
    </div>
</div>
</div>

</body>
</html>
