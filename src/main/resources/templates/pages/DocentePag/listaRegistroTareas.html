<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  <link rel="icon" type="image/png" th:href="@{/imagenes/img001-logo.png}" />
  <link rel="stylesheet" th:href="@{/css/stylesgeneral.css}">
  <title>Lista Registro Materia</title>
</head>
<body class="bg-white text-gray-900">
<!--Seccion1: Barra de naveagacion-->
<div class="m-14">
  <nav class="bg-gray-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200 ">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
      <a th:href="@{/}" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="/imagenes/img001-logo.png" class="h-8" alt="Flowbite Logo">
        <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">TaskFlow</span>
      </a>
      <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
        <a th:href="@{/docente/inicioDocente}">
          <button type="button"
                  class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">
            Regresar
          </button>
        </a>
      </div>
    </div>
  </nav>
</div>


<div class="relative overflow-x-auto p-4 max-h-[500px] overflow-y-auto">
  <table class="w-full text-sm text-left text-gray-700 border border-gray-300">
    <caption>
      <h1 class="mb-4 text-4xl font-extrabold leading-none tracking-tight text-center md:text-5xl lg:text-6xl text-black">
        Lista de Estudiantes y sus Entregas
      </h1>
    </caption>
    <thead class="text-xs uppercase bg-gray-300">
    <tr>
      <th scope="col" class="px-6 py-3 border-b">Id</th>
      <th scope="col" class="px-6 py-3 border-b">Estudiante</th>
      <th scope="col" class="px-6 py-3 border-b">Estado</th>
      <th scope="col" class="px-6 py-3 border-b text-center">Opciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="registro : ${registroTareas}"
        class="bg-white border-b transition transform hover:scale-[1.01] hover:bg-indigo-50 hover:shadow-md">
      <th th:text="${registro.id}" scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap"></th>
      <td th:text="${registro.estudiante.nombre}" class="px-6 py-4"></td>
      <td th:text="${registro.estado}" class="px-6 py-4"></td>
      <td class="px-6 py-4 text-center">
        <a th:href="@{/registroTarea/editarRegistroDocente/}+${registro.id}"
           class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg transition-transform transform hover:scale-105 hover:rotate-1 hover:shadow-lg hover:bg-blue-700">
          Calificar
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
