<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Tarea</title>

    <!-- Tailwind y Flowbite -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <link rel="stylesheet" th:href="@{/css/stylesAditional.css}">
</head>
<body class="bg-gray-300">

<nav class="bg-gray-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a th:href="@{/}" class="flex items-center space-x-3 rtl:space-x-reverse">
            <img src="/imagenes/img001-logo.png" class="h-8" alt="Logo">
            <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">TaskFlow</span>
        </a>
        <a th:href="@{/docente/inicioDocente}">
            <button type="button"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">
                Regresar
            </button>
        </a>
    </div>
</nav>

<div class="pt-24 flex justify-center pb-24 mb-10">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-xl border border-gray-300">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Registrar Nueva Tarea</h2>

        <form id="tareaForm" th:action="@{/tarea/guardarTarea}" method="post" th:object="${tarea}">
            <input type="hidden" th:field="*{id}" />

            <!-- Nombre de la tarea -->
            <div class="mb-4">
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <div class="input-card-blue">
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre del archivo o URL"
                           class="w-full border-none rounded-lg px-3 py-3 focus:ring focus:ring-blue-500"/>
                </div>
                <span id="error-nombre" class="text-red-600 text-sm"></span>
            </div>

            <!-- Descripcion -->
            <div class="mb-4">
                <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripcion</label>
                <div class="input-card-blue">
                    <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                              class="w-full border-none rounded-lg px-3 py-3 focus:ring focus:ring-blue-500"
                              placeholder="Indicaciones para la tarea"></textarea>
                </div>
                <span id="error-descripcion" class="text-red-600 text-sm"></span>
            </div>

            <!-- Tipo Tarea -->
            <div class="mb-4">
                <label for="tipoTarea" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Tarea</label>
                <div class="input-card-blue">
                    <select id="tipoTarea" th:field="*{tipo}"
                            class="w-full border-none rounded-lg px-3 py-3 focus:ring focus:ring-blue-500">
                        <option value="">-- Selecciona un tipo --</option>
                        <option value="Proyecto">Proyecto</option>
                        <option value="Taller">Taller</option>
                        <option value="Deber">Deber</option>
                        <option value="Exposición">Exposición</option>
                        <option value="Ensayo">Ensayo</option>
                        <option value="Quiz">Quiz</option>
                    </select>
                </div>
                <span id="error-tipo" class="text-red-600 text-sm"></span>
            </div>

            <!-- Materia -->
            <div class="mb-4">
                <label for="materia" class="block text-sm font-medium text-gray-700 mb-1">Materia</label>
                <div class="input-card-blue">
                    <select id="materia" th:field="*{materia.id}"
                            class="w-full border-none rounded-lg px-3 py-3 focus:ring focus:ring-blue-500">
                        <option value="" disabled selected>Seleccione una materia</option>
                        <option th:each="m : ${materiasDocente}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>
                <span id="error-materia" class="text-red-600 text-sm"></span>
            </div>

            <!-- Fecha de Entrega -->
            <div class="mb-4">
                <label for="fechaEntrega" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Entrega</label>
                <div class="input-card-blue">
                    <input type="date" id="fechaEntrega" th:field="*{fechaEntrega}"
                           class="w-full border-none rounded-lg px-3 py-3 focus:ring focus:ring-blue-500"/>
                </div>
                <span id="error-fechaEntrega" class="text-red-600 text-sm"></span>
            </div>

            <!-- Mensaje de advertencia -->
            <div id="mensaje-error-boton" class="text-red-600 text-sm mb-2 hidden text-center">
                Debe llenar todos los campos
            </div>

            <button id="submitBtn" type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200"
                    disabled>
                Crear Tarea
            </button>

        </form>
    </div>
</div>

<!-- Script para mostrar errores y activar el botón -->
<script>
    const form = document.getElementById('tareaForm');
    const submitBtn = document.getElementById('submitBtn');
    const mensajeErrorBoton = document.getElementById('mensaje-error-boton');

    const campos = [
        {id: 'nombre', msg: 'El nombre es obligatorio'},
        {id: 'descripcion', msg: 'La descripción es obligatoria'},
        {id: 'tipoTarea', msg: 'Selecciona un tipo de tarea'},
        {id: 'materia', msg: 'Selecciona una materia'},
        {id: 'fechaEntrega', msg: 'Selecciona una fecha de entrega'}
    ];

    // Función que valida los campos y activa/desactiva el botón
    function validarCampos() {
        let todosLlenos = true;
        let hayVacio = false;

        campos.forEach(campo => {
            const el = document.getElementById(campo.id);
            const span = document.getElementById('error-' + campo.id);
            if (!el.value || el.value.trim() === '') {
                todosLlenos = false;
                hayVacio = true;
            }
        });

        submitBtn.disabled = !todosLlenos;

        // Mostrar mensaje de error si hay campos vacíos
        if (hayVacio) {
            mensajeErrorBoton.classList.remove('hidden');
        } else {
            mensajeErrorBoton.classList.add('hidden');
        }
    }

    // Validar cada campo al escribir o cambiar
    campos.forEach(campo => {
        const el = document.getElementById(campo.id);
        const span = document.getElementById('error-' + campo.id);
        el.addEventListener('input', () => {
            span.textContent = '';
            validarCampos();
        });
        el.addEventListener('change', () => {
            span.textContent = '';
            validarCampos();
        });
    });

    // Inicialmente validar
    validarCampos();

    // Validación al presionar submit
    form.addEventListener('submit', function(e) {
        let hayError = false;
        campos.forEach(campo => {
            const el = document.getElementById(campo.id);
            const span = document.getElementById('error-' + campo.id);
            if (!el.value || el.value.trim() === '') {
                span.textContent = campo.msg;
                hayError = true;
            } else {
                span.textContent = '';
            }
        });

        if (hayError) {
            e.preventDefault(); // evita enviar el formulario
            mensajeErrorBoton.classList.remove('hidden');
        }
    });
</script>




</body>
</html>
